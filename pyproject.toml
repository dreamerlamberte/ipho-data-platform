[project]
name = "ipho-data-platform"
version = "0.1.0"
description = "Centralized data platform for the Integrated Provincial Health Office (IPHO): ingestion, medallion lakehouse, dbt models, and AI-ready marts."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyarrow>=17",
    "duckdb>=1.1",
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["generator", "ingestion", "api"]

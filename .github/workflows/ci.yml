name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      PII_HASH_SALT: ci-only-salt
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: {enable-cache: true}
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q
      - name: End-to-end pipeline (generate → ingest → dbt build)
        run: make pipeline
      - name: dbt docs
        run: uv run dbt docs generate --project-dir transform --profiles-dir transform
        env:
          LAKE_PATH: ${{ github.workspace }}/data/lake
          WAREHOUSE_PATH: ${{ github.workspace }}/data/warehouse/ipho.duckdb
      - uses: actions/upload-artifact@v7
        with:
          name: dbt-docs
          path: |
            transform/target/index.html
            transform/target/manifest.json
            transform/target/catalog.json

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [pipeline, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build pipeline image
        run: docker build -t ipho-data-platform:${{ github.sha }} .
      - name: Run full compose stack (Postgres source → lake → dbt)
        run: docker compose up --build --exit-code-from pipeline pipeline
      - name: Bring up API + web and smoke-test through the web proxy
        run: |
          docker compose up --build -d web
          for i in $(seq 1 30); do curl -fs localhost:3900/api/health && break; sleep 2; done
          curl -fs localhost:3900/api/overview | head -c 300
          docker compose down

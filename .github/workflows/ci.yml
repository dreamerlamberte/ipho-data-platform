name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      PII_HASH_SALT: ci-only-salt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q
      - name: End-to-end pipeline (generate → ingest → dbt build)
        run: make pipeline
      - name: dbt docs
        run: uv run dbt docs generate --project-dir transform --profiles-dir transform
        env:
          LAKE_PATH: ${{ github.workspace }}/data/lake
          WAREHOUSE_PATH: ${{ github.workspace }}/data/warehouse/ipho.duckdb
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            transform/target/index.html
            transform/target/manifest.json
            transform/target/catalog.json

  docker:
    runs-on: ubuntu-latest
    needs: pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Build pipeline image
        run: docker build -t ipho-data-platform:${{ github.sha }} .
      - name: Run full compose stack (Postgres source → lake → dbt)
        run: docker compose up --build --exit-code-from pipeline pipeline
